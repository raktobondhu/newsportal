<!doctype html>
<meta charset="utf-8">
<style>
  /* ফন্ট ফাইলটাই এখানে এম্বেড হয় — সিস্টেমে Kalpurush আছে ধরে নিলে
     Linux/CI-তে বাংলা যুক্তাক্ষর ভেঙে যায়। */
  {{FONTFACE}}

  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden; position: relative;
    font-family: 'KothaBangla', 'Kalpurush', 'Nirmala UI', sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #16283f 60%, #102a3d 100%);
    color: #fff;
    display: flex; flex-direction: column;
  }

  /* ছবি ১৬:৯ ব্যান্ড হিসেবে উপরে।
     পুরো বর্গ ভরাতে গেলে ১২০০x৬৩০ ছবিকে ১.৭ গুণ টেনে বড় করতে হয় এবং
     ঘোলা দেখায়। এখানে ১০৮০ চওড়ায় বসাতে ছবিটাকে বরং ছোট করতে হয় (০.৯x),
     তাই যেকোনো og:image-ও ঝকঝকে থাকে। */
  .photo {
    width: 1080px; height: 608px; flex: none;
    background-image: url('{{IMAGE}}');
    background-size: cover;
    background-position: center 40%;
  }

  .logo {
    position: absolute; top: 40px; left: 46px;
    /* ৭৬ → ৫২: লোগোর SVG এখন লেখা বরাবর কাটা (দেখুন card-text.html) */
    height: 52px; width: auto;
    padding: 10px 18px; border-radius: 11px;
    background: rgba(8,12,22,.45);
    /* brightness — লোগোর নেভি প্রান্ত গাঢ় প্লেটে মিশে যায়
       (ব্যাখ্যা card-text.html-এ) */
    filter: brightness(2.2) saturate(.85) drop-shadow(0 3px 10px rgba(0,0,0,.55));
  }

  .content {
    flex: 1; padding: 40px 64px 56px;
    display: flex; flex-direction: column; justify-content: center;
  }

  .chip {
    display: inline-block; align-self: flex-start;
    background: {{ACCENT}}; color: #fff;
    padding: 10px 28px; border-radius: 7px;
    font-size: 30px; font-weight: bold; margin-bottom: 24px;
  }

  h1 { margin: 0; font-size: {{FONTSIZE}}px; line-height: 1.34; font-weight: bold; }

  /* বাঁয়ে স্লোগান, ডানে তারিখ */
  .meta {
    margin-top: auto; padding-top: 22px;
    border-top: 2px solid rgba(255,255,255,.18);
    display: flex; justify-content: space-between;
    font-size: 26px; opacity: .75;
  }
</style>

<div class="photo"></div>
<img class="logo" src="{{LOGO}}" alt="">

<div class="content">
  <div class="chip">{{CATEGORY}}</div>
  <h1>{{HEADLINE}}</h1>
  <div class="meta"><span>{{SLOGAN}}</span><span>{{DATE}}</span></div>
</div>
