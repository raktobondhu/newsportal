<!doctype html>
<meta charset="utf-8">
<style>
  /* ফন্ট ফাইলটাই এখানে এম্বেড হয় — সিস্টেমে Kalpurush আছে ধরে নিলে
     Linux/CI-তে বাংলা যুক্তাক্ষর ভেঙে যায়। */
  {{FONTFACE}}

  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px; overflow: hidden; position: relative;
    font-family: 'KothaBangla', 'Kalpurush', 'Nirmala UI', sans-serif;
    background: linear-gradient(155deg, #0f172a 0%, #1a2f4d 55%, #123047 100%);
    color: #fff;
  }

  /* হালকা টেক্সচার — একদম ফ্ল্যাট রঙ ফিডে বিজ্ঞাপনের মতো দেখায় */
  body::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 78% 18%, {{ACCENT}}26 0%, transparent 46%);
  }

  /* টেক্সট কার্ডে ব্যাকগ্রাউন্ড নিয়ন্ত্রণে আছে, তাই প্লেট লাগে না */
  /* উচ্চতা ৮৪ থেকে ৫৬ — লোগোর SVG আগে ৯৬০x৫৪০ ক্যানভাসে ছিল, লেখাটা
     তার মাঝে ছোট হয়ে বসত। এখন ফাইলটা লেখা বরাবর কাটা, তাই ৮৪px দিলে
     লোগো দেড়গুণ বড় দেখাত। */
  /* লোগোর গ্রেডিয়েন্ট টিল থেকে গাঢ় নেভিতে নামে। কার্ডের পটভূমিও গাঢ়
     নেভি, ফলে "খুন" অংশটা পটভূমিতে মিশে যেত — দূর থেকে নামটা "লি"
     পড়াত। brightness গ্রেডিয়েন্টটাকে তুলে দেয়, তাই ব্র্যান্ডের রঙ
     থাকে অথচ পড়া যায়। সাদা করে দিলে পড়া যেত বটে, রঙটা হারাত। */
  .logo {
    position: absolute; top: 46px; left: 60px; z-index: 2;
    height: 56px; width: auto;
    filter: brightness(2.2) saturate(.85);
  }

  .content {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 64px 64px; box-sizing: border-box;
  }

  .chip {
    display: inline-block; background: {{ACCENT}}; color: #fff;
    padding: 11px 30px; border-radius: 7px;
    font-size: 31px; font-weight: bold; margin-bottom: 26px;
  }

  h1 { margin: 0; font-size: {{FONTSIZE}}px; line-height: 1.36; font-weight: bold; }

  /* বাঁয়ে স্লোগান, ডানে তারিখ — দুই প্রান্তে দুটো, তাই space-between।
     আগে কেবল তারিখ ছিল বলে flex-end লাগত। */
  .meta {
    margin-top: 34px; padding-top: 24px;
    border-top: 2px solid rgba(255,255,255,.22);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 27px; opacity: .8;
  }
</style>

<img class="logo" src="{{LOGO}}" alt="">

<div class="content">
  <div class="chip">{{CATEGORY}}</div>
  <h1>{{HEADLINE}}</h1>
  <div class="meta">
    <span>{{SLOGAN}}</span>
    <span>{{DATE}}</span>
  </div>
</div>
